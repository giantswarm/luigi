version: 2.1
orbs:
  architect: giantswarm/architect@10.4.0

workflows:
  go-build:
    jobs:
      - architect/go-build:
          context: architect
          name: go-build-luigi
          binary: luigi
          architectures: "linux/amd64,linux/arm64,darwin/amd64,darwin/arm64,windows/amd64,windows/arm64"
          # Needed to trigger job also on git tag.
          filters:
            tags:
              only: /^v.*/

      - architect/upload-release-assets:
          context: architect
          name: upload-release-assets
          binary: luigi
          requires:
            - go-build-luigi
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
